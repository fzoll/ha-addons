name: T3 add-on tests
on:
  push:
    paths: ["t3-code-runner/**", ".github/workflows/t3-helper-tests.yml"]
  pull_request:
    paths: ["t3-code-runner/**", ".github/workflows/t3-helper-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n t3-code-runner/run.sh
      # Building the image verifies the pinned T3 Code, cloudflared and gh
      # downloads against their checksums and runs each binary once.
      - run: docker build -t t3-code-runner-test t3-code-runner
      - run: docker run --rm t3-code-runner-test sh -c 't3 --version && cloudflared --version && gh --version && claude --version'
