name: T3 Code Runner
version: "0.5.1"
slug: t3-code-runner
description: Official T3 Code server — always-on T3 Code environment on this Home Assistant host
url: https://github.com/fzoll/ha-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ports:
  3773/tcp: 3773
ports_description:
  3773/tcp: T3 Code HTTP/WebSocket API — T3 clients on the local network or tailnet connect here
# /data is the add-on's private volume and is wiped on uninstall. Keep the T3
# data directory, cloned repositories, and provider logins under /share so a
# reinstall does not lose the T3 Connect link, projects, or repositories.
map:
  - share:rw
options:
  t3_connect: true
  anthropic_api_key: ""
schema:
  t3_connect: bool
  anthropic_api_key: password
